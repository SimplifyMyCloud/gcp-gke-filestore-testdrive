apiVersion: batch/v1
kind: Job
metadata:
  name: generate-test-data
  namespace: default
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: data-generator
        image: busybox
        command: ["/bin/sh"]
        args:
        - -c
        - |
          echo "Starting data generation..."

          # Create 10x 1GB files
          for i in $(seq 1 10); do
            echo "Creating 1GB file $i of 10..."
            dd if=/dev/zero of=/data/testfile-${i}.dat bs=1M count=1024
            echo "Created testfile-${i}.dat (1GB)"
          done

          # Create some text files with metadata
          echo "Creating metadata files..."
          for i in $(seq 1 10); do
            echo "File: testfile-${i}.dat" > /data/testfile-${i}.info
            echo "Created: $(date)" >> /data/testfile-${i}.info
            echo "Size: 1GB" >> /data/testfile-${i}.info
            echo "Pod: $(hostname)" >> /data/testfile-${i}.info
          done

          # Create a summary file
          echo "Test Data Generation Summary" > /data/SUMMARY.txt
          echo "=============================" >> /data/SUMMARY.txt
          echo "Generated by: $(hostname)" >> /data/SUMMARY.txt
          echo "Date: $(date)" >> /data/SUMMARY.txt
          echo "Total files: 10" >> /data/SUMMARY.txt
          echo "Total size: 10GB" >> /data/SUMMARY.txt
          echo "" >> /data/SUMMARY.txt
          echo "Files created:" >> /data/SUMMARY.txt
          ls -lh /data/*.dat >> /data/SUMMARY.txt

          echo "Data generation complete!"
        volumeMounts:
        - name: filestore-volume
          mountPath: /data
      volumes:
      - name: filestore-volume
        persistentVolumeClaim:
          claimName: filestore-pvc
---
apiVersion: v1
kind: Pod
metadata:
  name: storage-reader
  namespace: default
spec:
  containers:
  - name: reader
    image: busybox
    command: ["/bin/sh"]
    args:
    - -c
    - |
      echo "Storage reader pod started. Reading from shared storage..."
      while true; do
        echo "=== Storage Status at $(date) ==="
        df -h /data
        echo ""
        echo "Files in /data:"
        ls -lh /data/
        echo ""
        if [ -f /data/SUMMARY.txt ]; then
          echo "Summary content:"
          cat /data/SUMMARY.txt
        fi
        echo "================================="
        sleep 60
      done
    volumeMounts:
    - name: filestore-volume
      mountPath: /data
  volumes:
  - name: filestore-volume
    persistentVolumeClaim:
      claimName: filestore-pvc